          fill="none"
          stroke="currentColor"
          stroke-width="3.6"
          stroke-linejoin="round" />
    <path d="M36 26L38.2 33.8L46 36L38.2 38.2L36 46L33.8 38.2L26 36L33.8 33.8L36 26Z"
          fill="none"
          stroke="currentColor"
          stroke-width="3.2"
          stroke-linejoin="round" />
</svg>
