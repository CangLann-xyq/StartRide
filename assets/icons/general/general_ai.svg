<!--
  AI 助手图标：一大一小两颗四角星（sparkle）。
  刻意用直线 + 圆形转角，而不是曲线：18px 下曲线星会糊成一团光斑，
  直线在同样尺寸下边缘还能看清。
  stroke="currentColor"：颜色由 SvgIcon 的 Foreground 决定（导航选中/未选中自动跟随主题）。
-->
<svg width="32" height="32" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
